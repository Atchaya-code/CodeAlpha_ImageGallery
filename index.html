
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>My Image Gallery</h1>
        <p>A collection of beautiful moments</p>
    </header>

    <div class="filter-buttons">
        <button class="active" data-filter="all">All</button>
        <button data-filter="nature">Nature</button>
        <button data-filter="animals">Animals</button>
        <button data-filter="flowers">Flowers</button>
    </div>

    <div class="gallery">
        <div class="gallery-item" data-category="nature">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600" alt="Beautiful mountain landscape">
        </div>

        <div class="gallery-item" data-category="animals">
            <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=600" alt="Cute dog">
        </div>

        <div class="gallery-item" data-category="flowers">
            <img src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=600" alt="Pink flowers">
        </div>

        <div class="gallery-item" data-category="nature">
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=600" alt="Lake and mountains">
        </div>

        <div class="gallery-item" data-category="animals">
            <img src="https://images.unsplash.com/photo-1517849845537-4d257902454a?w=600" alt="Dog portrait">
        </div>

        <div class="gallery-item" data-category="flowers">
            <img src="https://images.unsplash.com/photo-1494972308805-463bc619d34e?w=600" alt="Beautiful flower">
        </div>
    </div>

    <div class="lightbox" id="lightbox">
        <span class="close">&times;</span>
        <img id="lightbox-image" src="" alt="Selected gallery image">
    </div>

    <script src="script.js"></script>
</body>
</html>
